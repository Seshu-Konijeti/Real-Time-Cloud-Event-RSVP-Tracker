<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Event RSVP Tracker</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav><span class="brand">Cloud Event RSVP Tracker</span><div id="navLinks"></div></nav>
<div class="container"><div class="card"><h1>Upcoming Events</h1>
<p class="muted"><span class="pulse"></span>Counts refresh automatically.</p><div id="eventList">Loading...</div></div></div>
<script src="/static/js/api.js"></script>
<script>
(async () => { const { user } = await API.me(); document.getElementById("navLinks").innerHTML = navHtml(user); })();
async function loadEvents() {
  try {
    const { events } = await API.getEvents("?upcoming=true");
    const list = events.filter(e => e.status === "PUBLISHED" || e.status === "FULL");
    document.getElementById("eventList").innerHTML = list.length ? list.map(e => `
      <div class="event-row"><div><strong><a href="/event_detail.html?id=${esc(e.id)}">${esc(e.event_name)}</a></strong>
      <div class="muted">${esc(e.event_date)} · ${esc(e.start_time)}-${esc(e.end_time)} · ${esc(e.venue || e.online_link || "TBA")}</div></div>
      <div><span class="badge going">${e.going_count} going</span> ${statusPill(e.status)}</div></div>`).join("")
      : `<p class="muted">No upcoming events.</p>`;
  } catch (e) { document.getElementById("eventList").innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}
loadEvents(); setInterval(loadEvents, 4000);
</script></body></html>
